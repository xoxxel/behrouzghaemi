<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Resume — Behrouz Ghaemi</title>
<meta name="description" content="Resume of Behrouz Ghaemi — backend architect and product designer. Preview it here or download the PDF.">
<meta name="theme-color" content="#C4D5CB">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<style>
  @font-face{font-family:'Inter';font-style:normal;font-weight:100 900;font-display:swap;src:url('/assets/inter-latin.woff2') format('woff2')}
  @font-face{font-family:'JetBrains Mono';font-style:normal;font-weight:400 800;font-display:swap;src:url('/assets/jetbrains-mono-latin.woff2') format('woff2')}

  :root{
    --sage:#C4D5CB;
    --ink:#101412;
    --ink-2:#2F3E45;
    --accent:#0B6670;
    --line:rgba(16,20,18,.16);
    --on-dark:#EEF4F6;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
    --mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
  body{
    margin:0;
    background:var(--sage);
    color:var(--ink);
    font-family:var(--sans);
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }
  a{color:inherit}
  .sr-only{
    position:absolute;width:1px;height:1px;padding:0;margin:-1px;
    overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;
  }

  /* header */
  .top{
    max-width:1008px;
    margin:0 auto;
    padding:clamp(20px,4vw,44px) clamp(12px,3vw,24px) 0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .brand{
    font-size:clamp(17px,1.6vw,21px);
    font-weight:500;
    letter-spacing:.04em;
    text-decoration:none;
    white-space:nowrap;
  }
  .brand .acc{color:var(--accent)}
  .back{
    font-family:var(--mono);
    font-size:11px;
    letter-spacing:.12em;
    text-transform:uppercase;
    text-decoration:none;
    color:var(--ink-2);
    padding-bottom:3px;
    border-bottom:1px solid transparent;
    transition:color .3s ease,border-color .3s ease;
    white-space:nowrap;
  }
  .back:hover{color:var(--ink);border-color:var(--line)}
  .brand:focus-visible,.back:focus-visible,.dl:focus-visible{outline:2px solid var(--accent);outline-offset:4px}

  /* preview */
  main{
    max-width:1008px;
    margin:0 auto;
    padding:clamp(28px,5vw,56px) clamp(12px,3vw,24px) 140px;
  }
  .meta{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    gap:16px;
    margin:0 2px 14px;
    font-family:var(--mono);
    font-size:10.5px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--ink-2);
  }
  .paper{
    margin:0;
    background:#F1F2EE;
    border-radius:2px;
    overflow:hidden;
    box-shadow:0 40px 90px -50px rgba(16,20,18,.5);
  }
  .paper img{display:block;width:100%;height:auto}

  /* floating download */
  .dl{
    position:fixed;
    z-index:10;
    right:clamp(16px,3vw,32px);
    bottom:calc(clamp(16px,3vw,32px) + env(safe-area-inset-bottom));
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    height:54px;
    padding:0 22px;
    border-radius:999px;
    background:var(--ink);
    color:var(--on-dark);
    text-decoration:none;
    font-size:14.5px;
    font-weight:500;
    letter-spacing:.01em;
    box-shadow:0 18px 40px -16px rgba(16,20,18,.55);
    transition:background-color .3s ease,transform .3s ease;
  }
  .dl:hover{background:#0B4F5C;transform:translateY(-1px)}
  .dl:active{transform:translateY(0)}
  .dl svg{flex:none}

  @media (max-width:560px){
    .top{padding-top:20px;gap:12px}
    .back{font-size:10px;letter-spacing:.08em}
    main{padding-top:30px;padding-bottom:118px}
    .meta{font-size:10px;letter-spacing:.1em;margin-bottom:10px}
    .dl{left:16px;right:16px;height:56px}
  }
  @media (prefers-reduced-motion:reduce){
    *{transition:none!important}
  }
</style>
</head>
<body>

<h1 class="sr-only">Resume — Behrouz Ghaemi</h1>

<header class="top">
  <a class="brand" href="/">Behrouzghaemi<span class="acc">@</span></a>
  <a class="back" href="/">&larr; Back to portfolio</a>
</header>

<main>
  <div class="meta" aria-hidden="true">
    <span>Resume &mdash; 1405</span>
    <span>Behrouz Ghaemi</span>
  </div>

  <figure class="paper">
    <img
      src="/cv.webp"
      width="1920"
      height="7532"
      alt="Preview of Behrouz Ghaemi's resume (in Persian)"
      fetchpriority="high"
      decoding="async">
  </figure>
</main>

<a class="dl" href="/cv.pdf" download="Behrouz-Ghaemi-Resume.pdf">
  <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M8 2.5v8M4.5 7 8 10.5 11.5 7M2.5 13.5h11"/>
  </svg>
  <span>Download PDF</span>
</a>

</body>
</html>
